[project]
name = "deep-learning-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "ruff>=0.17.1",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
